name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install clang-18 and project dev dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18
          python3 -m pip install --upgrade pip
          pip install -e ".[dev,gcp]"

      - name: Run Ruff lint
        run: ruff check src/ tests/ benchmarks/

      - name: Run Mypy strict typecheck
        run: mypy --strict src/

      - name: Run Pytest suite
        run: pytest -v --tb=short

      - name: Run benchmark threshold check
        run: PYTHONPATH=src python benchmarks/bench_astraea.py --check-thresholds
